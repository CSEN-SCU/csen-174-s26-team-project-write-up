name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/coaching-api/package-lock.json
            extension/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend/coaching-api
          npm ci --prefix extension

      - name: Run W5 test suite (Vitest)
        run: |
          npm --prefix backend/coaching-api run test
          npm --prefix extension run test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_SECRET }}
